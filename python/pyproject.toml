[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfmd"
dynamic = ["version"]
description = "Fast, dependency-free PDF to Markdown converter"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cole McIntosh", email = "colemcintosh6@gmail.com" }]
keywords = ["pdf", "markdown", "parser", "converter", "text-extraction"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# No runtime dependencies: the bindings are `ctypes` over the crate's C ABI.
dependencies = []

# `python -m pdfmd` works without this; the script is what makes an
# installed wheel usable from a shell. A `cargo install`ed binary of the
# same name lives in ~/.cargo/bin, so PATH order picks the winner when
# both are present — they convert identically.
[project.scripts]
pdfmd = "pdfmd.__main__:main"

[project.urls]
Homepage = "https://colesmcintosh.github.io/pdfmd/"
Repository = "https://github.com/colesmcintosh/pdfmd"

[tool.setuptools]
packages = ["pdfmd"]
include-package-data = true

[tool.setuptools.package-data]
pdfmd = ["py.typed", "*.so", "*.dylib", "*.dll"]
