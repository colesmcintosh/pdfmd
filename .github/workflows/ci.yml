name: CI

# Two things make this workflow unusual, both because `[dependencies]` is
# empty. There is nothing to cache: `Swatinem/rust-cache` spends longer
# restoring and saving a tarball than a cold build of this crate takes
# (clippy ~2s, `test --all-targets` ~5s, the cdylib ~4s), so every job
# builds from scratch. And lint, test, and python do not install a
# toolchain: GitHub's runner images ship rustup with stable, cargo,
# clippy, and rustfmt already. `msrv` is the exception. It asks that
# same rustup for the `rust-version` in Cargo.toml, because stable does
# not prove the floor. No toolchain action — downloading stable a
# second time would only add latency.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Nothing here is rebuilt twice, so incremental state is pure overhead.
  CARGO_INCREMENTAL: "0"
  # Full debug info is ~2.5s of compile and 220MB of `target/` that CI
  # never reads; line tables still give backtraces their line numbers.
  # Named levels need Cargo 1.71. The `msrv` job overrides these.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # fmt and clippy are seconds of work each; a second runner for them
  # would cost more in startup than it saves.
  lint:
    name: lint
    runs-on: ubuntu-latest
    # `cargo package` is a second compile plus an index refresh.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # `publish --dry-run` rejects a version already on crates.io, so
      # the standing check is the tarball itself. `--list` guards the
      # exclude list; the second invocation builds that tarball.
      - name: package
        run: |
          set -euo pipefail
          list=$(cargo package --locked --list)
          printf '%s\n' "$list"
          need() {
            printf '%s\n' "$list" | grep -qx "$1" || {
              echo "package is missing $1" >&2
              exit 1
            }
          }
          forbid() {
            if printf '%s\n' "$list" | grep -q "$1"; then
              echo "package should not match $1" >&2
              printf '%s\n' "$list" | grep "$1" >&2
              exit 1
            fi
          }
          need README.md
          need LICENSE
          need VISION.md
          need CONTRIBUTING.md
          need src/lib.rs
          need src/main.rs
          need Cargo.lock
          forbid '^tests/'
          forbid '^python/'
          forbid '^docs/'
          forbid '^\.github/'
          forbid '^AGENTS\.md$'
          forbid '^CLAUDE\.md$'
          forbid '\.pdf$'
          cargo package --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PRs need a fast merge gate. macOS/Windows run on main and
        # workflow_dispatch so platform bugs still get caught on every merge.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked --all-targets --all-features

  # Proves `rust-version` in Cargo.toml. Stable on the runner is not the
  # floor, and a v4 Cargo.lock fails `--locked` here (Cargo 1.70 cannot
  # read it). Named debuginfo (`line-tables-only`) needs Cargo 1.71, so
  # this job uses the integer level 1.70 does accept.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the declared rust-version
        run: |
          msrv="$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "Cargo.toml has no rust-version" >&2
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          rustup default "$msrv"
          rustc --version
      - run: cargo test --locked --all-targets --all-features

  python:
    name: python (${{ matrix.python }})
    # ubuntu-latest is 26.04, and actions/python-versions ships no CPython
    # 3.9 build for it. 24.04 still has 3.9, which is what pyproject.toml
    # declares as the floor. The job name stays `python (3.9)`.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor and current: the bindings are ctypes, so nothing is compiled
        # against a Python ABI and these two bracket the supported range.
        python: ["3.9", "3.13"]
    env:
      # These tests only need a cdylib that loads and answers correctly.
      # LTO and one codegen unit buy runtime speed nothing here measures,
      # at ~5x the build time.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # --lib is the cdylib and nothing else; the CLI binary and the
      # dev harnesses in src/bin are already covered by the test job.
      - run: cargo build --release --locked --lib
      - name: unit tests against the freshly built cdylib
        run: python -m unittest discover -s python/tests
      - name: build and install the wheel
        # Without this, setup.py shells out to its own `cargo build
        # --release` and pays for the whole crate a second time.
        env:
          PDFMD_LIBRARY: ${{ github.workspace }}/target/release/libpdfmd.so
        run: |
          python -m pip wheel ./python --no-deps -w dist
          python -m pip install --no-index --find-links dist pdfmd
      - name: the installed package finds its own library
        run: |
          cd "$RUNNER_TEMP"
          python -c "import pdfmd; print(pdfmd.__version__, pdfmd.library_path())"
      - name: the installed console script converts a PDF
        run: |
          pdfmd tests/fixtures/sample.pdf -o "$RUNNER_TEMP/out.md"
          head -1 "$RUNNER_TEMP/out.md"

  # Scores committed fixtures against hand-written Markdown. The same
  # test also runs inside `test` and `msrv`; this job is the one that
  # publishes the report. A drop of more than the baseline tolerance
  # fails the test, which fails this job.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: score fixtures
        run: cargo test --locked --test quality -- --nocapture
      - name: summary
        if: always()
        run: |
          if [ -f target/quality-summary.md ]; then
            cat target/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f target/quality-report.md ]; then
            cat target/quality-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality report was not written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-report
          path: |
            target/quality-report.md
            target/quality-report.json
            target/quality-summary.md
          if-no-files-found: warn
