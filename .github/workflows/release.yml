name: Release

# Tagging v<Cargo.toml version> does two independent things.
#
# `publish` runs `cargo publish`. It reads CARGO_REGISTRY_TOKEN and
# fails if that secret is missing or rejected. `binaries` / `release`
# do not need it, and they do not `needs:` publish — a crates.io
# failure must still leave the GitHub release with its archives.
#
# Linux jobs target the musl triples. Those link rustc's bundled musl
# (static-pie, `crt-static` by default), so there is no musl cross
# toolchain to install. aarch64 uses the native ARM runner for the
# same reason: the host is already the machine the binary runs on.
# There is still nothing to cache; see ci.yml.
#
# Pushing the tag is the trigger. If a GitHub release for that tag
# already exists (notes written by hand, which is how v0.1–v0.3 were
# cut), the workflow only uploads archives and does not replace the
# body. PyPI is not a target: the project name there is taken.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches Cargo.toml
        run: bash .github/scripts/check-release-tag.sh
      - name: registry token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set."
            echo "Add a crates.io token under Settings → Secrets and variables → Actions."
            echo "This job is the only one that needs it. The binary release still runs."
            exit 1
          fi
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches Cargo.toml
        run: bash .github/scripts/check-release-tag.sh
      - name: package
        run: bash .github/scripts/package-cli.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/pdfmd-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches Cargo.toml
        run: bash .github/scripts/check-release-tag.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cd dist
          shopt -s nullglob
          # One archive per binaries matrix entry.
          archives=(pdfmd-*.tar.gz pdfmd-*.zip)
          if [ "${#archives[@]}" -ne 5 ]; then
            echo "expected 5 archives, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" | LC_ALL=C sort -k 2 > SHA256SUMS
          cd "${GITHUB_WORKSPACE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/pdfmd-*.tar.gz dist/pdfmd-*.zip dist/SHA256SUMS --clobber
            exit 0
          fi
          args=(
            release create "$tag"
            dist/pdfmd-*.tar.gz dist/pdfmd-*.zip dist/SHA256SUMS
            --title "pdfmd ${tag}"
            --notes-file .github/release-notes.md
          )
          case "$version" in
            *-*) args+=(--prerelease) ;;
          esac
          gh "${args[@]}"
